[package]
name = "astra-launcher"
version = "1.13.5"
description = "ASTRA — лаунчер для RAGE:MP сервера"
authors = ["ASTRA Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools", "unstable", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures-util = "0.3"
dirs = "5"
tokio = { version = "1", features = ["full"] }
discord-rich-presence = "0.2"
once_cell = "1"
chrono = "0.4"
zip = "2"
sha2 = "0.10"
windows = { version = "0.56", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    # ShellExecuteW + SW_HIDE — used to relaunch ourselves elevated (UAC)
    # when the hosts-file whitelist bypass needs administrator rights.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
